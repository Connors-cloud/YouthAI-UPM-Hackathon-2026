<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouthAI Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="app-page page-preload">
    <div class="app-shell">
        <aside class="sidebar">
            <h2>YouthAI</h2>
            <a href="{{ url_for('dashboard') }}" class="" data-nav-link>Dashboard</a>
            <a href="{{ url_for('chat') }}" class="" data-nav-link>AI Chat (Gemini)</a>
            <a href="{{ url_for('mood') }}" class="" data-nav-link>Mood Tracker</a>
            <a href="{{ url_for('career') }}" class="" data-nav-link>Career Guide</a>
            <a href="{{ url_for('programs') }}" class="" data-nav-link>Programs</a>
            <a href="{{ url_for('profile') }}" class="active" data-nav-link>Profile</a>
            <form method="post" action="{{ url_for('logout') }}" class="sidebar-logout" data-animate-submit>
                <button type="submit">Log Out</button>
            </form>
        </aside>

        <main class="main-content page-stage">
            <section class="panel">
                <h2>Profile</h2>
                <p><strong>Name:</strong> {{ username }}</p>
                <p><strong>Email:</strong> {{ email }}</p>
                <p><strong>Mood Logs:</strong> {{ full_mood_history|length }}</p>
                <p><strong>Programs Joined:</strong> {{ registered|length }}</p>
                <p><strong>AI Messages:</strong> {{ chat_msgs|length }}</p>
                <p><strong>AI Provider:</strong> Gemini</p>
                <div class="dark-mode-toggle">
                    <label for="dark-mode">Dark Mode:</label>
                    <input type="checkbox" id="dark-mode" name="dark-mode">
                </div>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
